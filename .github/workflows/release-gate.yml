name: TDS GA7 Release Gate

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: "TDS identity: 24f3003757@ds.study.iitm.ac.in"
        run: echo "TDS identity 24f3003757@ds.study.iitm.ac.in"

      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Smoke-test release-gate logic
        run: |
          python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("rg", "Problem-1/api/release-gate.py")
          rg = importlib.util.module_from_spec(spec); spec.loader.exec_module(rg)

          safe = {
            "target": "preview", "event": "pull_request", "ref": "refs/heads/feature",
            "workflow": {
              "trigger": "pull_request",
              "permissions": {"contents": "read", "packages": "write", "id-token": "none"},
              "testsPassed": True, "matrixComplete": True, "failFast": False,
              "actions": [{"owner": "actions", "name": "checkout", "ref": "v4"}]
            },
            "image": {"multiStage": True, "runsAsRoot": False, "secretMode": "buildkit",
                      "criticalVulnerabilities": 0, "digestPinned": True}
          }
          assert rg.evaluate(safe) == [], rg.evaluate(safe)

          bad = dict(safe)
          bad["image"] = dict(safe["image"]); bad["image"]["runsAsRoot"] = True
          assert "ROOT_RUNTIME" in rg.evaluate(bad)

          prod = {
            "target": "production", "event": "push", "ref": "refs/heads/dev",
            "workflow": {
              "trigger": "push",
              "permissions": {"contents": "read", "packages": "write", "id-token": "none"},
              "actions": [{"owner": "docker", "name": "build-push-action", "ref": "v5"}]
            },
            "image": {"multiStage": False, "runsAsRoot": False, "secretMode": "arg",
                      "criticalVulnerabilities": 3, "digestPinned": False}
          }
          got = set(rg.evaluate(prod))
          expected = {"MUTABLE_ACTION", "SINGLE_STAGE_IMAGE", "SECRET_IN_LAYER",
                      "CRITICAL_CVE", "UNPINNED_IMAGE", "INVALID_PRODUCTION_REF",
                      "APPROVAL_REQUIRED"}
          assert got == expected, (got ^ expected)
          print("OK")
          PY
